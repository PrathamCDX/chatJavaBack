spring.application.name=demo

# Load variables from .env in the project root (optional: app still starts if the file is missing).
# Each value below falls back to the default after the colon when the variable is not set.
spring.config.import=optional:file:.env[.properties]

# PORT is set by hosts like Render; SERVER_PORT is for local use
server.port=${PORT:${SERVER_PORT:8080}}

# Database: SQLite file. foreign_keys=true is needed on every connection, SQLite ignores FKs otherwise.
# The file is created on first start; on a server, point DB_URL at a disk that survives redeploys.
spring.datasource.url=${DB_URL:jdbc:sqlite:./javademo.db?foreign_keys=true}
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite allows one writer at a time; a single connection avoids "database is locked" errors
spring.datasource.hikari.maximum-pool-size=1

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# JWT (secret must be >= 32 bytes; always override in real deployments)
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.cookie-name=${JWT_COOKIE_NAME:token}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# WebSocket: browser origins allowed to open /ws/chat (comma-separated, [*] matches any port)
websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:[*]}
# Heartbeat: ping every client this often; close a client that has sent nothing (message or pong)
# for idle-timeout. Keep idle-timeout at 2-3x the interval so one lost pong doesn't close a live client.
websocket.heartbeat-interval-ms=${WS_HEARTBEAT_INTERVAL_MS:30000}
websocket.idle-timeout-ms=${WS_IDLE_TIMEOUT_MS:75000}
