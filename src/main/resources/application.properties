spring.application.name=demo

# Load variables from .env in the project root (optional: app still starts if the file is missing).
# Each value below falls back to the default after the colon when the variable is not set.
spring.config.import=optional:file:.env[.properties]

# PORT is set by hosts like Render; SERVER_PORT is for local use
server.port=${PORT:${SERVER_PORT:8080}}

# Database: PostgreSQL. Set DB_URL in full, or DB_HOST/DB_PORT/DB_NAME (Render gives the parts separately).
# The database must exist; Hibernate creates the tables in it.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:javademo}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# Give the connection back after each transaction. Otherwise open-in-view keeps it until the request ends,
# so each slow upload (PUT /storage/...) would hold one of the pool's connections the whole time
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

# JWT (secret must be >= 32 bytes; always override in real deployments)
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.cookie-name=${JWT_COOKIE_NAME:token}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# File parts uploaded to PUT /storage/{messageId}/parts/{partNo}, saved as {dir}/{fileId}/{partNo}
storage.dir=${STORAGE_DIR:./uploads}

# WebSocket: browser origins allowed to open /ws/chat (comma-separated, [*] matches any port)
websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:[*],https://chatjavaback.vercel.app}
# Heartbeat: ping every client this often; close a client that has sent nothing (message or pong)
# for idle-timeout. Keep idle-timeout at 2-3x the interval so one lost pong doesn't close a live client.
websocket.heartbeat-interval-ms=${WS_HEARTBEAT_INTERVAL_MS:30000}
websocket.idle-timeout-ms=${WS_IDLE_TIMEOUT_MS:75000}
